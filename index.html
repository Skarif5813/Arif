<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Movie Ticket Booking</title>
  <style>
    :root {
      --body-bg: #242526;
      --container-bg: #18191a;
      --primary-color: #3498db;
      --seat-available: #4e4e50;
      --seat-selected: #2ecc71;
      --seat-occupied: #e74c3c;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--body-bg);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .booking-container {
      background-color: var(--container-bg);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Movie Selection */
    .movie-container {
      margin: 20px 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .movie-container select {
      background-color: #3a3b3c;
      color: var(--text-color);
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    /* Legend Showcase */
    .showcase {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 20px;
      border-radius: 5px;
      list-style-type: none;
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .showcase li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    /* Common Seat Styles */
    .seat {
      background-color: var(--seat-available);
      height: 26px;
      width: 30px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .seat:hover:not(.occupied) {
      transform: scale(1.15);
    }

    .seat.selected {
      background-color: var(--seat-selected);
    }

    .seat.occupied {
      background-color: var(--seat-occupied);
      cursor: not-allowed;
    }

    /* Theater Layout */
    .theater-container {
      perspective: 1000px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      background-color: #fff;
      height: 70px;
      width: 100%;
      margin: 15px 0 30px 0;
      transform: rotateX(-45deg);
      box-shadow: 0 3px 20px rgba(255, 255, 255, 0.7);
      border-radius: 5px;
    }

    .seating-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    /* Add walkway gaps between columns */
    .seat:nth-of-type(2),
    .seat:nth-of-type(6) {
      margin-right: 18px;
    }

    /* Summary Information */
    .summary-text {
      margin-top: 10px;
      font-size: 15px;
      text-align: center;
    }

    .summary-text span {
      color: var(--primary-color);
      font-weight: bold;
    }

    button.book-btn {
      margin-top: 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: background 0.2s;
    }

    button.book-btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="booking-container">
    <h2>Movie Ticket Booking</h2>

    <!-- Movie Selection dropdown -->
    <div class="movie-container">
      <label for="movie">Select Movie:</label>
      <select id="movie">
        <option value="12">Avengers: Endgame (\$12)</option>
        <option value="10">Inception (\$10)</option>
        <option value="15">Avatar: The Way of Water (\$15)</option>
        <option value="8">Interstellar (\$8)</option>
      </select>
    </div>

    <!-- Status Legend -->
    <ul class="showcase">
      <li>
        <div class="seat"></div>
        <small>Available</small>
      </li>
      <li>
        <div class="seat selected"></div>
        <small>Selected</small>
      </li>
      <li>
        <div class="seat occupied"></div>
        <small>Occupied</small>
      </li>
    </ul>

    <!-- Theater Matrix -->
    <div class="theater-container">
      <div class="screen"></div>

      <div class="seating-grid" id="seatingGrid">
        <!-- 6 Rows of 8 Seats -->
        <div class="row">
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat occupied"></div>
          <div class="seat occupied"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat occupied"></div><div class="seat occupied"></div>
        </div>
        <div class="row">
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat occupied"></div><div class="seat occupied"></div>
          <div class="seat"></div><div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat occupied"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
        </div>
        <div class="row">
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
          <div class="seat"></div><div class="seat"></div>
        </div>
      </div>
    </div>

    <!-- Calculations Text -->
    <p class="summary-text">
      You have selected <span id="count">0</span> seats for a total price of \$<span id="total">0</span>
    </p>

    <button class="book-btn" id="bookBtn">Confirm Booking</button>
  </div>

  <script>
    const seatingGrid = document.getElementById('seatingGrid');
    const movieSelect = document.getElementById('movie');
    const count = document.getElementById('count');
    const total = document.getElementById('total');
    const bookBtn = document.getElementById('bookBtn');

    // Get initial movie ticket price from the value attribute
    let ticketPrice = parseInt(movieSelect.value);

    // Update total price and count of seats selected
    function updateSelectedCount() {
      const selectedSeats = document.querySelectorAll('.row .seat.selected');
      const selectedSeatsCount = selectedSeats.length;

      count.innerText = selectedSeatsCount;
      total.innerText = selectedSeatsCount * ticketPrice;
    }

    // Movie selection change event
    movieSelect.addEventListener('change', (e) => {
      ticketPrice = parseInt(e.target.value);
      updateSelectedCount();
    });

    // Seat click event (using event delegation on parent container)
    seatingGrid.addEventListener('click', (e) => {
      if (e.target.classList.contains('seat') && !e.target.classList.contains('occupied')) {
        e.target.classList.toggle('selected');
        updateSelectedCount();
      }
    });

    // Final checkout button alert logic
    bookBtn.addEventListener('click', () => {
      const selectedSeatsCount = document.querySelectorAll('.row .seat.selected').length;
      if (selectedSeatsCount > 0) {
        alert(`Successfully booked ${selectedSeatsCount} tickets! Total paid: $${selectedSeatsCount * ticketPrice}`);
        
        // Turn selected seats into occupied seats upon checkout
        document.querySelectorAll('.row .seat.selected').forEach(seat => {
          seat.classList.remove('selected');
          seat.classList.add('occupied');
        });
        updateSelectedCount();
      } else {
        alert('Please select at least one seat to book.');
      }
    });
  </script>
</body>
</html>
